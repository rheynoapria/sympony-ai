<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pony</title>
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="notch.css" />
  <link rel="stylesheet" href="carousel.css" />
  <link rel="stylesheet" href="modules.css" />
  <link rel="stylesheet" href="stylelib.css" />
  <link rel="stylesheet" href="floating-chat.css" />
</head>
<body class="floating-chat-body">
  <div id="notch" class="floating-chat-shell open floating">
    <header class="fc-bar">
      <div class="fc-drag" data-tauri-drag-region>
        <span class="fc-dot" id="fcDot" aria-hidden="true"></span>
        <span class="fc-title" id="fcTitle">Pony</span>
        <span class="fc-model" id="fcModel"></span>
      </div>
      <div class="fc-acts">
        <button type="button" class="fc-btn" id="fcNew" title="New chat"></button>
        <button type="button" class="fc-btn" id="fcHist" title="History"></button>
        <span class="fc-sep" aria-hidden="true"></span>
        <button type="button" class="fc-btn on" id="fcPin" title="Always on top" aria-pressed="true"></button>
        <button type="button" class="fc-btn" id="fcDock" title="Dock back to notch"></button>
        <button type="button" class="fc-btn" id="fcSettings" title="Settings"></button>
        <button type="button" class="fc-btn close" id="fcClose" title="Close"></button>
      </div>
    </header>
    <div id="fcToast" aria-live="polite"></div>
    <main class="fc-main">
      <section class="tab-page active" id="page-chat"></section>
    </main>
  </div>

  <script src="i18n.js"></script>
  <script src="bridge.js"></script>
  <script src="tint.js"></script>
  <script src="icons.js"></script>
  <script src="clock.js"></script>
  <script src="notchkit.js"></script>
  <script src="pony.js"></script>
  <script src="modules/nlp.js"></script>
  <script src="floating-chat.js"></script>
  <script src="modules/data.js"></script>
  <script src="modules/chat.js"></script>
  <script>N.bootFloatingChat();</script>
</body>
</html>
