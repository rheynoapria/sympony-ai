<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pony</title>
  <!-- Pony's Hands overlay: shows (never takes clicks) while Pony works on the screen. The edges glow in Sympony's
       aurora as on the welcome screen; Pony's own live cursor goes to what it acts on. Only transform and opacity
       animate (DESIGN.md / onboarding §3.5). -->
  <style>
    :root { --au1: #6d55e8; --au2: #8f7bff; --au3: #c6bbff; --au4: #f2a8d6; --ease: cubic-bezier(.22, 1, .36, 1); }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default;
      font: 500 12.5px/1.3 -apple-system, "SF Pro Text", system-ui, sans-serif; color: #fff; }
    #root { position: fixed; inset: 0; opacity: 0; transition: opacity 500ms var(--ease); pointer-events: none; }
    body.on #root { opacity: 1; }

    /* the glowing edges: four strips, a gradient that flows along them by translate */
    .strip { position: fixed; overflow: hidden; opacity: .78; }
    .strip.t, .strip.b { left: 0; right: 0; height: 9vmin; }
    .strip.l, .strip.r { top: 0; bottom: 0; width: 9vmin; }
    .strip.t { top: 0; -webkit-mask: linear-gradient(180deg, #000, rgba(0,0,0,.5) 22%, rgba(0,0,0,.14) 55%, transparent); }
    .strip.b { bottom: 0; -webkit-mask: linear-gradient(0deg, #000, rgba(0,0,0,.5) 22%, rgba(0,0,0,.14) 55%, transparent); }
    .strip.l { left: 0; -webkit-mask: linear-gradient(90deg, #000, rgba(0,0,0,.5) 22%, rgba(0,0,0,.14) 55%, transparent); }
    .strip.r { right: 0; -webkit-mask: linear-gradient(270deg, #000, rgba(0,0,0,.5) 22%, rgba(0,0,0,.14) 55%, transparent); }
    .flow { position: absolute; inset: 0; width: 200%; will-change: transform;
      background: linear-gradient(90deg, var(--au1), var(--au2) 18%, var(--au3) 34%, var(--au4) 52%, var(--au2) 70%, var(--au1) 86%, var(--au1));
      background-size: 50% 100%; animation: flowX 14s linear infinite; }
    .strip.b .flow { animation-direction: reverse; }
    .strip.l .flow, .strip.r .flow { width: 100%; height: 200%; background-size: 100% 50%; animation-name: flowY;
      background-image: linear-gradient(180deg, var(--au1), var(--au2) 18%, var(--au3) 34%, var(--au4) 52%, var(--au2) 70%, var(--au1) 86%, var(--au1)); }
    .strip.l .flow { animation-direction: reverse; }
    @keyframes flowX { to { transform: translateX(-50%); } }
    @keyframes flowY { to { transform: translateY(-50%); } }
    #edges { animation: breathe 4.5s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .72; } }

    /* what Pony is doing, under the notch */
    #status { position: fixed; top: 46px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
      padding: 7px 14px 7px 10px; border-radius: 999px; background: rgba(12, 10, 28, .78); box-shadow: 0 0 0 1px rgba(198,187,255,.22), 0 8px 28px rgba(64,40,180,.35);
      white-space: nowrap; max-width: 60vw; }
    #status i { width: 7px; height: 7px; border-radius: 50%; background: var(--au3); box-shadow: 0 0 10px var(--au2); animation: blink 1.4s ease-in-out infinite; }
    #status span { overflow: hidden; text-overflow: ellipsis; }
    @keyframes blink { 50% { opacity: .35; } }

    /* Pony's cursor: a pointer tip at (x, y), Pony beside it, and what it's about to do */
    #cur { position: fixed; left: 0; top: 0; transform: translate(-200px, -200px); transition: transform 620ms var(--ease); will-change: transform; }
    #cur svg { position: absolute; left: -3px; top: -2px; width: 22px; height: 24px; filter: drop-shadow(0 2px 6px rgba(40,20,140,.55)); }
    #cur canvas { position: absolute; left: 12px; top: 10px; width: 64px; height: 54px; }
    #label { position: absolute; left: 74px; top: 26px; padding: 5px 10px; border-radius: 10px; white-space: nowrap; max-width: 320px;
      overflow: hidden; text-overflow: ellipsis; background: rgba(12, 10, 28, .82); box-shadow: 0 0 0 1px rgba(198,187,255,.25); opacity: 0; transition: opacity 250ms var(--ease); }
    #label.on { opacity: 1; }
    .ring { position: fixed; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 2px solid var(--au3);
      box-shadow: 0 0 14px var(--au2); opacity: .9; animation: ring 700ms var(--ease) forwards; }
    .ring.point { animation: ring 1300ms var(--ease) 3; }
    @keyframes ring { from { transform: scale(.35); opacity: .95; } to { transform: scale(1.6); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .flow, #edges, #status i { animation: none; }
      #cur { transition: none; }
      .ring { animation-duration: 1ms; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="edges">
      <div class="strip t"><div class="flow"></div></div>
      <div class="strip b"><div class="flow"></div></div>
      <div class="strip l"><div class="flow"></div></div>
      <div class="strip r"><div class="flow"></div></div>
    </div>
    <div id="status"><i></i><span id="status-t"></span></div>
    <div id="cur">
      <svg viewBox="0 0 22 24" aria-hidden="true"><path d="M3 2 L3 19 L7.6 14.8 L10.6 21.6 L13.6 20.3 L10.7 13.6 L17 13.4 Z" fill="#c6bbff" stroke="#1d1730" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <canvas id="pony" width="64" height="54"></canvas>
      <div id="label"></div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="pony.js"></script>
  <script src="hands.js"></script>
</body>
</html>
