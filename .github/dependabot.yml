# Security-only Dependabot configuration:
# - Routine version-bump PRs are disabled (`open-pull-requests-limit: 0`) to prevent PR/CI churn.
# - Security patch PRs (CVEs) still target `beta` without auto-rebasing on every push.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    rebase-strategy: "disabled"
    labels: ["dependencies", "rust", "security"]

  - package-ecosystem: "bun"
    directory: "/settings-ui"
    target-branch: "beta"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    rebase-strategy: "disabled"
    labels: ["dependencies", "frontend", "security"]
