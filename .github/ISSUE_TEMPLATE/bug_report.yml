name: Bug Report
description: Report a bug or unexpected behavior in Sympony
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search existing issues first.
        For **security vulnerabilities**, please use **GitHub Security Advisories** instead of a public issue (see `SECURITY.md`).

  - type: dropdown
    id: platform
    attributes:
      label: Platform & Architecture
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 10/11 (x64 Beta)
        - Linux (roadmap / source build)
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS Version & Sympony Version
      placeholder: "e.g., macOS 15.3 / Sympony v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Pony AI (Brain / Skills / Memory / MCP / Paseo Bridge)
        - Pony Eyes, Hands & Auto UI
        - Voice (Dictation / Voice Command / Auto UI)
        - Notch UI / Floating Chat / Settings
        - Modules (Media / YouTube / Calendar / Todo / Prayer / etc.)
        - Platform / Updater / Release Build
        - Security / Permissions / Privacy
        - Web Portal / Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly, including what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots (optional)
      description: Remember to strip any personal paths, API keys, or tokens before pasting.
      render: text
