name: CI

on:
  push:
    branches: ["main", "beta"]
  pull_request:
    branches: ["main", "beta"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend & Hygiene
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Repository hygiene & version consistency check
        run: |
          if git ls-files | grep -qE '(^\.signing/|\.env$|\.keychain-db$)'; then
            echo "::error::Sensitive local signing or env file committed to git!"
            exit 1
          fi
          ./tools/bump-version.sh --check
          bash -n release/build.sh
          python3 -m py_compile tools/release-notes.py
      - name: Frontend JS syntax check
        run: |
          for f in frontend/*.js frontend/modules/*.js; do
            node --check "$f"
          done
      - name: Frontend unit tests
        run: bun test ./frontend/tests
      - name: Settings UI install, test, and build
        run: |
          bun install --cwd settings-ui --frozen-lockfile
          bun test --cwd settings-ui
          bun run --cwd settings-ui build

  rust:
    name: Rust & Contract Parity (macOS)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-rust-macos
      - name: Rust workspace tests
        run: cargo test --workspace
      - name: Contract parity check
        run: cargo run -q -p services --bin parity

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # (the contract and MCP tests run small Python scripts)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-rust-windows
      - name: Rust workspace check (tests and examples too)
        run: cargo check --workspace --all-targets
      # (links the app itself: an extern that only exists on Unix shows here, not in check or the tests)
      - name: Build the app binary
        run: cargo build -p sympony
      - name: Rust workspace tests
        run: cargo test --workspace
      - name: Contract parity check
        run: cargo run -q -p services --bin parity
