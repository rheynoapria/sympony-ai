# Builds desktop installers per OS and publishes a GitHub Release on `v*` tags.
# Open-source builds work without any secrets (ad-hoc signed on macOS, SYMPONY_AI_URL unset).
# Official Enlabs releases inject Developer ID signing, Apple Notarization, and Sympony AI via repository secrets.
# Re-enable windows-latest and ubuntu-22.04 once crates/platform implements their OS backends.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag label for manual artifact build"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    environment: Production
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest] # , windows-latest, ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-rust-${{ matrix.os }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Import Apple Developer ID certificate & Notary API key
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE secret not set — building with ad-hoc signature"
            exit 0
          fi
          KC_PATH="$RUNNER_TEMP/sympony-release.keychain-db"
          KC_PASS=$(openssl rand -base64 24)
          P12_PATH="$RUNNER_TEMP/developer-id.p12"
          G2_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$P12_PATH"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$G2_PATH"

          security create-keychain -p "$KC_PASS" "$KC_PATH"
          security set-keychain-settings -lut 21600 "$KC_PATH"
          security unlock-keychain -p "$KC_PASS" "$KC_PATH"
          security import "$G2_PATH" -k "$KC_PATH" -A
          security import "$P12_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KC_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC_PATH" >/dev/null

          echo "Imported code signing identities:"
          security find-identity -v -p codesigning "$KC_PATH"

          echo "APPLE_KEYCHAIN=$KC_PATH" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

          if [ -n "${APPLE_API_KEY:-}" ]; then
            P8_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY" | base64 --decode > "$P8_PATH"
            chmod 600 "$P8_PATH"
            echo "APPLE_API_KEY_PATH=$P8_PATH" >> "$GITHUB_ENV"
          fi
          rm -f "$P12_PATH" "$G2_PATH"
      - name: Build installer
        env:
          SYMPONY_AI_URL: ${{ secrets.SYMPONY_AI_URL }}
          SYMPONY_GOOGLE_CLIENT_ID: ${{ secrets.SYMPONY_GOOGLE_CLIENT_ID }}
          SYMPONY_GOOGLE_CLIENT_SECRET: ${{ secrets.SYMPONY_GOOGLE_CLIENT_SECRET }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: release/build.sh
      - name: Clean up signing keychain & keys
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${APPLE_KEYCHAIN:-}" ] && [ -f "$APPLE_KEYCHAIN" ]; then
            security delete-keychain "$APPLE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
      - name: Generate SHA-256 checksums
        run: |
          cd release/out/*
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sympony-${{ runner.os }}
          path: release/out/

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name 'SHA256SUMS.txt' \) -exec cp {} release-assets/ \;
          ls -lh release-assets/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
