# Builds desktop installers per OS and publishes a GitHub Release on `v*` tags.
# Open-source builds work without any secrets (ad-hoc signed on macOS, SYMPONY_AI_URL unset).
# Official Enlabs releases inject Developer ID signing, Apple Notarization, and Sympony AI via repository secrets.
# Re-enable windows-latest and ubuntu-22.04 once crates/platform implements their OS backends.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag label for manual artifact build"
        required: false
        default: ""
      target:
        description: "OS target(s) to build"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - windows
          - macos
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Version & Tag
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
      release_title: ${{ steps.meta.outputs.release_title }}
      matrix_os: ${{ steps.meta.outputs.matrix_os }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate SemVer & manifest lockstep
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            ./tools/bump-version.sh --check --tag "$REF_NAME"
            if [[ "$REF_NAME" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "channel=beta" >> "$GITHUB_OUTPUT"
              echo "release_title=Sympony ${REF_NAME} (Beta)" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "channel=stable" >> "$GITHUB_OUTPUT"
              echo "release_title=Sympony ${REF_NAME}" >> "$GITHUB_OUTPUT"
            fi
          else
            ./tools/bump-version.sh --check
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=manual" >> "$GITHUB_OUTPUT"
            echo "release_title=Sympony Manual Build" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_TARGET" = "windows" ]; then
            echo 'matrix_os=["windows-latest"]' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_TARGET" = "macos" ]; then
            echo 'matrix_os=["macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix_os=["macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi
          bash -n release/build.sh
          python3 -m py_compile tools/release-notes.py

  build:
    name: Build (${{ matrix.os }})
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    environment: Production
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.validate.outputs.matrix_os) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-rust-${{ matrix.os }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Import Apple Developer ID certificate & Notary API key
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE secret not set — building with ad-hoc signature"
            exit 0
          fi
          KC_PATH="$RUNNER_TEMP/sympony-release.keychain-db"
          KC_PASS=$(openssl rand -base64 24)
          P12_PATH="$RUNNER_TEMP/developer-id.p12"
          G2_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$P12_PATH"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$G2_PATH"

          security create-keychain -p "$KC_PASS" "$KC_PATH"
          security set-keychain-settings -lut 21600 "$KC_PATH"
          security unlock-keychain -p "$KC_PASS" "$KC_PATH"
          security import "$G2_PATH" -k "$KC_PATH" -A
          security import "$P12_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KC_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC_PATH" >/dev/null

          echo "Imported code signing identities:"
          security find-identity -v -p codesigning "$KC_PATH"

          echo "APPLE_KEYCHAIN=$KC_PATH" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

          if [ -n "${APPLE_API_KEY:-}" ]; then
            P8_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY" | base64 --decode > "$P8_PATH"
            chmod 600 "$P8_PATH"
            echo "APPLE_API_KEY_PATH=$P8_PATH" >> "$GITHUB_ENV"
          fi
          rm -f "$P12_PATH" "$G2_PATH"
      - name: Build installer
        env:
          SYMPONY_AI_URL: ${{ secrets.SYMPONY_AI_URL }}
          SYMPONY_GOOGLE_CLIENT_ID: ${{ secrets.SYMPONY_GOOGLE_CLIENT_ID }}
          SYMPONY_GOOGLE_CLIENT_SECRET: ${{ secrets.SYMPONY_GOOGLE_CLIENT_SECRET }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: release/build.sh
      - name: Clean up signing keychain & keys
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${APPLE_KEYCHAIN:-}" ] && [ -f "$APPLE_KEYCHAIN" ]; then
            security delete-keychain "$APPLE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release/out/*
          if command -v shasum >/dev/null 2>&1; then SHACMD="shasum -a 256"; else SHACMD="sha256sum"; fi
          files=( *.dmg *.exe *.deb *.rpm *.AppImage *.tar.gz )
          if [ ${#files[@]} -gt 0 ]; then
            $SHACMD "${files[@]}" > SHA256SUMS.txt
          else
            $SHACMD * > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: sympony-${{ runner.os }}
          path: release/out/

  build-preview:
    name: Preview Build (${{ matrix.os }})
    needs: validate
    if: "!startsWith(github.ref, 'refs/tags/v')"
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.validate.outputs.matrix_os) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-rust-${{ matrix.os }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installer
        run: release/build.sh
      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release/out/*
          if command -v shasum >/dev/null 2>&1; then SHACMD="shasum -a 256"; else SHACMD="sha256sum"; fi
          files=( *.dmg *.exe *.deb *.rpm *.AppImage *.tar.gz )
          if [ ${#files[@]} -gt 0 ]; then
            $SHACMD "${files[@]}" > SHA256SUMS.txt
          else
            $SHACMD * > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: sympony-${{ runner.os }}
          path: release/out/

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Flatten release assets, generate notes & updater manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.sig' -o -name 'SHA256SUMS.txt' \) -exec cp {} release-assets/ \;

          python3 tools/release-notes.py \
            --tag "$RELEASE_TAG" \
            --repo "$REPO" \
            --changelog CHANGELOG.md \
            --assets-dir release-assets \
            --body-out release-body.md \
            --updater-out updater-notes.txt

          python3 - <<'PY'
          import datetime, glob, json, os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPO"]
          version = tag.lstrip("v")
          notes = Path("updater-notes.txt").read_text(encoding="utf-8").strip()
          snippets = sorted(glob.glob("dist/**/updater-*.json", recursive=True))
          platforms = {}
          for path in snippets:
              data = json.load(open(path, "r", encoding="utf-8"))
              target = data["target"]
              filename = data["file"]
              signature = data["signature"]
              platforms[target] = {
                  "signature": signature,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{filename}",
              }

          if not platforms:
              print("No updater-*.json manifests found; skipping latest.json generation")
          else:
              manifest = {
                  "version": version,
                  "notes": notes or f"- Improved: Sympony {tag}",
                  "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "platforms": platforms,
              }
              out_path = "release-assets/latest.json"
              with open(out_path, "w", encoding="utf-8") as f:
                  json.dump(manifest, f, indent=2)
                  f.write("\n")
              print(f"Generated {out_path} for v{version} with targets: {sorted(platforms.keys())}")
          PY
          echo "=== Release Assets ==="
          ls -lh release-assets/
          echo "=== Generated Release Body ==="
          cat release-body.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.validate.outputs.release_title }}
          body_path: release-body.md
          files: release-assets/*
          generate_release_notes: false
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
      - name: Update floating beta-channel manifest
        if: hashFiles('release-assets/latest.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Only advance beta-channel when this release is >= the version currently pointed to by beta-channel
          # (ensures Beta users get every new -beta tag AND seamlessly graduate to newer Stable releases,
          # while preventing an older Stable hotfix from downgrading users already on a newer Beta).
          SHOULD_UPDATE=$(python3 - <<'PY'
          import json, os, re, urllib.request

          def parse_ver(v):
              v = v.strip().lstrip("v")
              m = re.match(r"^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?", v)
              if not m:
                  return ((0, 0, 0), 0, ())
              core = (int(m.group(1)), int(m.group(2)), int(m.group(3)))
              pre = m.group(4)
              if not pre:
                  return (core, 1, ())
              parts = tuple((0, int(p)) if p.isdigit() else (1, p) for p in pre.split("."))
              return (core, 0, parts)

          new_ver = json.load(open("release-assets/latest.json"))["version"]
          repo = os.environ["REPO"]
          url = f"https://github.com/{repo}/releases/download/beta-channel/latest.json"
          try:
              with urllib.request.urlopen(url, timeout=15) as r:
                  cur_ver = json.loads(r.read().decode("utf-8")).get("version", "")
              if cur_ver and parse_ver(new_ver) < parse_ver(cur_ver):
                  print(f"skip:{new_ver}<{cur_ver}")
              else:
                  print(f"update:{cur_ver or 'none'}->{new_ver}")
          except Exception:
              print(f"update:none->{new_ver}")
          PY
          )
          echo "beta-channel check: $SHOULD_UPDATE"
          if [[ "$SHOULD_UPDATE" == skip:* ]]; then
            echo "Keeping newer beta-channel pointer unchanged."
            exit 0
          fi
          cat <<EOF > beta-notes.md
          Rolling auto-updater manifest for users who enabled **Watch Beta updates** in Sympony (**Settings → About & Updates**).

          Currently pointing to: **[\`${RELEASE_TAG}\`](https://github.com/${REPO}/releases/tag/${RELEASE_TAG})**.

          > This pre-release only hosts \`latest.json\` for the in-app updater; download installers from the versioned release linked above.
          EOF
          sed -i 's/^          //' beta-notes.md
          if gh release view beta-channel --repo "$REPO" >/dev/null 2>&1; then
            gh release upload beta-channel release-assets/latest.json --repo "$REPO" --clobber
            gh release edit beta-channel --repo "$REPO" --notes-file beta-notes.md
          else
            gh release create beta-channel release-assets/latest.json \
              --repo "$REPO" \
              --target "$TARGET_SHA" \
              --prerelease \
              --title "Beta Channel (Auto-Updater Manifest)" \
              --notes-file beta-notes.md
          fi
