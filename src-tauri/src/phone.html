<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Sympony</title>
<style>
  :root { --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --sub: #6e6e73; --line: #e5e5ea; --accent: #0a84ff; --ok: #30a14e; --bad: #d70015; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --sub: #98989f; --line: #2c2c2e; --ok: #30d158; --bad: #ff453a; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; margin: 4px 4px 18px; }
  header .logo { width: 34px; height: 34px; border-radius: 9px; background: #111; color: #fff; display: grid; place-items: center; font-weight: 700; }
  header b { font-size: 20px; display: block; }
  header small { color: var(--sub); }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--sub); margin: 0 4px 8px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 12px; padding: 14px;
    font: inherit; font-weight: 600; background: var(--accent); color: #fff; cursor: pointer; }
  .btn.alt { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; }
  input[type=file] { display: none; }
  textarea { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit;
    background: transparent; color: inherit; margin-bottom: 10px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li small { color: var(--sub); white-space: nowrap; }
  li a { color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .empty { color: var(--sub); text-align: center; padding: 8px 0; }
  .note { color: var(--sub); font-size: 13px; text-align: center; margin-top: 8px; min-height: 18px; }
</style>
</head>
<body>
<header><span class="logo">S</span><span><b>Sympony</b><small id="pc">On this Wi-Fi</small></span></header>

<h2>Send to the Mac</h2>
<div class="card">
  <label class="btn" for="pick">Choose photos or files</label>
  <input id="pick" type="file" multiple>
  <ul id="sent"></ul>
</div>

<h2>Send text or a link</h2>
<div class="card">
  <textarea id="txt" placeholder="Type or paste here. It goes to the Mac’s clipboard." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  <button class="btn" id="send">Send</button>
  <div class="note" id="tnote"></div>
</div>

<h2>On the Mac’s Shelf</h2>
<div class="card"><ul id="files"><li class="empty">Loading…</li></ul></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const size = (n) => n == null ? '' : n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';

async function info() {
  try {
    const r = await fetch('info', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    $('pc').textContent = d.pc ? 'Connected to ' + d.pc : 'Connected';
    $('files').innerHTML = d.files.length
      ? d.files.map((f) => `<li><span class="n">${esc(f.name)}</span><small>${size(f.size)}</small><a href="file/${encodeURIComponent(f.id)}" download="${esc(f.name)}">Download</a></li>`).join('')
      : '<li class="empty">Nothing on the Shelf</li>';
  } catch (e) {
    $('pc').textContent = 'Sharing has stopped on the Mac';
    $('files').innerHTML = '<li class="empty">Start sharing again on the Mac</li>';
  }
}

// one file at a time, each with its bar
let queue = Promise.resolve();
function upload(file) {
  const li = document.createElement('li');
  li.innerHTML = `<span class="n">${esc(file.name)}<div class="bar"><i></i></div></span><small>${size(file.size)}</small>`;
  $('sent').prepend(li);
  const bar = li.querySelector('i');
  const state = li.querySelector('small');
  queue = queue.then(() => new Promise((done) => {
    const x = new XMLHttpRequest();
    x.open('PUT', 'upload?name=' + encodeURIComponent(file.name || 'file'));
    x.setRequestHeader('X-Sympony-Request', '1');
    x.upload.onprogress = (e) => { if (e.lengthComputable) bar.style.width = (e.loaded / e.total * 100) + '%'; };
    x.onload = () => { const ok = x.status === 200; state.className = ok ? 'ok' : 'bad'; state.textContent = ok ? 'Sent' : 'Failed'; bar.style.width = '100%'; done(); };
    x.onerror = () => { state.className = 'bad'; state.textContent = 'Failed'; done(); };
    x.send(file);
  }));
}
$('pick').onchange = (e) => { [...e.target.files].forEach(upload); e.target.value = ''; };

$('send').onclick = async () => {
  const t = $('txt').value;
  if (!t.trim()) return;
  $('send').disabled = true;
  try {
    const r = await fetch('text', { method: 'POST', body: t, headers: { 'Content-Type': 'text/plain; charset=utf-8', 'X-Sympony-Request': '1' } });
    $('tnote').className = 'note ' + (r.ok ? 'ok' : 'bad');
    $('tnote').textContent = r.ok ? 'Copied on the Mac' : r.status === 413 ? 'Too long' : 'Couldn’t send';
    if (r.ok) $('txt').value = '';
  } catch (e) { $('tnote').className = 'note bad'; $('tnote').textContent = 'Couldn’t send'; }
  $('send').disabled = false;
};

info();
setInterval(() => { if (!document.hidden) info(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) info(); });
</script>
</body>
</html>
