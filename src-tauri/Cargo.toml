[package]
name = "sympony"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "sympony_lib"
# ponytail: rlib only; staticlib/cdylib are for Tauri iOS/Android and cost ~600 MB per build

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
contract = { path = "../crates/contract" }
services = { path = "../crates/services" }
platform = { path = "../crates/platform" }
voice = { path = "../crates/voice" }
libc = "0.2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
url = "2"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
# (only with dev-drive: the version wry uses)
webview2-com = { version = "0.39", optional = true }

[features]
# Test builds only, never the shipped app: a live check runs a script in a window over agent.sock (src/devdrive.rs)
dev-drive = ["dep:webview2-com"]
