[package]
name = "platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OS platform bindings (macOS Accessibility, AppKit, Audio, Notifications; Windows in progress) for Sympony"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
cpal = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
# (what windows-sys leaves out: the COM interfaces of the Explorer file dialog, UI Automation, Core Audio and WMI;
# WinRT's media controls)
windows = { version = "0.62", features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Wmi", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
# (examples/media_source.rs: a silent player in the system media controls, to try Music with)
windows = { version = "0.62", features = ["Foundation_Collections", "Media_Core", "Media_Playback"] }

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = "0.37"
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKEvent", "EKCalendarItem", "EKCalendar", "EKObject", "EKTypes", "EKParticipant", "block2", "objc2-app-kit"] }
security-framework = "3"
objc2 = "0.6"
objc2-core-location = { version = "0.3", features = ["CLLocationManager", "CLLocation", "CLGeocoder", "CLPlacemark", "block2"] }
block2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["AVPlayer", "AVPlayerItem", "AVAsset", "AVMediaFormat"] }
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSValue", "NSGeometry", "NSArray", "NSObject", "NSError", "NSTimeZone", "NSDate", "NSProcessInfo", "NSData", "NSURL", "NSFileManager", "NSItemProvider", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSResponder", "NSGraphics", "NSRunningApplication", "NSWorkspace", "NSEvent", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics", "NSColor", "NSColorSpace", "NSPasteboard", "NSPasteboardItem", "NSSharingService", "NSView", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSApplication"] }
